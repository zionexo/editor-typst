[package]
name    = "typster"
version = "0.1.1"
edition = "2021"

[lib]
name = "typster_lib"

[[bin]]
name = "typster"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog = "2"
typst-core          = { path = "../crates/typst-core" }
serde               = { version = "1", features = ["derive"] }
